[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scanlayer"
version = "1.0.0"
description = "Image (scan/photo) to searchable PDF, or raw OCR export, via Tesseract."
requires-python = ">=3.9"
dependencies = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "reportlab>=4.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pdf2image>=1.17.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
yaml = ["PyYAML>=6.0"]

[project.scripts]
scanlayer = "scanlayer.cli:main"

[tool.setuptools.packages.find]
include = ["scanlayer*"]

[tool.setuptools.package-data]
scanlayer = ["fonts/*.ttf"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B904"]
